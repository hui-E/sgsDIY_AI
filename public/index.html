<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16130e">
  <title>三国杀武将 DIY</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 阶段一：编辑信息 -->
    <section id="edit-view" class="view">
      <header class="topbar">
        <div>
          <h1>三国杀武将 DIY</h1>
          <p class="subtitle">录入武将信息</p>
        </div>
        <span class="step-badge">1 / 2</span>
      </header>

      <div class="card-form">
        <div class="field">
          <label>势力</label>
          <div id="faction" class="faction-grid"></div>
        </div>

        <div class="field">
          <label>武将名称 <span class="req">*</span></label>
          <input id="name" type="text" maxlength="8" placeholder="例如：貂蝉" autocomplete="off">
        </div>

        <div class="field">
          <label>称号</label>
          <input id="title" type="text" maxlength="10" placeholder="例如：绝世的舞姬" autocomplete="off">
        </div>

        <div class="field">
          <label>血量</label>
          <div class="hp-row">
            <button id="hp-minus" class="stepbtn" type="button" aria-label="减少血量">−</button>
            <input id="hp" type="number" min="0" max="10" value="3" inputmode="numeric">
            <button id="hp-plus" class="stepbtn" type="button" aria-label="增加血量">＋</button>
            <span class="hint">0 ~ 10</span>
          </div>
        </div>

        <div class="field">
          <label>武将图片 <span class="req">*</span></label>
          <div class="img-row">
            <button id="pick-image" class="ghost" type="button">从相册选择</button>
            <span id="image-name" class="img-name">未选择</span>
          </div>
          <div id="image-preview" class="image-preview hidden"></div>
        </div>

        <div class="field">
          <label>技能 <span class="count" id="skill-count"></span></label>
          <div id="skills" class="skills"></div>
          <button id="add-skill" class="ghost add" type="button">＋ 新增技能</button>
        </div>

        <button id="next" class="primary" type="button">下一步</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </section>

    <!-- 阶段二：排版 -->
    <section id="layout-view" class="view hidden">
      <header class="topbar">
        <button id="back" class="iconbtn" type="button" aria-label="返回编辑">‹</button>
        <div class="title-center">
          <h1>排版</h1>
          <p class="subtitle">拖动 / 双指缩放 → 保存</p>
        </div>
        <button id="save" class="primary sm" type="button">保存</button>
      </header>

      <div class="canvas-wrap">
        <canvas id="card" width="1425" height="2048"></canvas>
      </div>

      <div class="toolbar">
        <button id="tool-image" class="tool active" type="button" data-tool="image">武将图</button>
        <button id="tool-name" class="tool" type="button" data-tool="name">名称</button>
        <button id="tool-title" class="tool" type="button" data-tool="title">称号</button>
      </div>
      <p id="layout-hint" class="hints">拖动武将图 / 名称 / 称号，双指缩放图片；点上方切换。</p>
    </section>

  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
